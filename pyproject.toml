[project]
name = "zura-paintout"
version = "0.1.3"
description = "Precise video object removal in ComfyUI, with masks, clean-frame guides and an optional local Studio interface."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
    "scipy",
    "OpenImageIO",
    "opencv-python-headless",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/ZURAVFX/Zura-Paintout"
Documentation = "https://github.com/ZURAVFX/Zura-Paintout#run-the-comfy-workflow"
Issues = "https://github.com/ZURAVFX/Zura-Paintout/issues"

[tool.comfy]
PublisherId = "zuravfx"
DisplayName = "Zura Paintout"
includes = ["app", "paintout", "example_workflows", "workflows", "build"]
